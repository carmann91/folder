media:
  input: assets/uploads
  output: assets/uploads
  categories:
  - image
  rename: safe
content:
- name: site
  label: Contatti e homepage
  type: file
  path: data/site.json
  format: json
  fields:
  - name: whatsappNumber
    label: Numero WhatsApp (es. )
    type: string
    required: true
  - name: bookingMessage
    label: Messaggio richiesta prenotazione
    type: text
    required: true
  - name: address
    label: Indirizzo
    type: text
  - name: hours
    label: Orari
    type: text
  - name: mapUrl
    label: Link HTTPS Google Maps
    type: string
  - name: instagramUrl
    label: Link HTTPS Instagram
    type: string
  - name: reviewsUrl
    label: Link HTTPS recensioni Google
    type: string
  - name: menuUrl
    label: Menu esterno HTTPS (opzionale)
    type: string
  - name: heroTitle
    label: Titolo principale
    type: string
  - name: heroEmphasis
    label: Titolo in corsivo
    type: string
  - name: heroDescription
    label: Testo copertina
    type: text
  - name: introLead
    label: Introduzione breve
    type: string
  - name: introText
    label: Testo osteria
    type: text
  - name: introExtra
    label: Secondo paragrafo osteria
    type: text
  - name: photos
    label: 'Fotografie (ordine: copertina, cucina, sala, vino)'
    type: object
    list: true
    fields:
    - name: src
      label: Immagine
      type: image
    - name: alt
      label: Descrizione accessibile
      type: string
      required: true
  - name: mapEmbedUrl
    label: URL incorporamento Google Maps
    type: string
  - name: instagramPosts
    label: Post Instagram pubblici da mostrare
    type: object
    list: true
    fields:
    - name: url
      label: Link al post o reel Instagram
      type: string
      required: true
  - name: reviews
    label: Recensioni reali da mostrare (trascrizione manuale)
    type: object
    list: true
    fields:
    - name: author
      label: Nome pubblico autore
      type: string
      required: true
    - name: text
      label: Testo recensione
      type: text
      required: true
    - name: rating
      label: Voto (opzionale, solo se noto)
      type: number
      options:
        min: 1
        max: 10
    - name: date
      label: Data recensione (opzionale)
      type: string
    - name: ratingMax
      label: 'Scala del voto: 5 per Google, 10 per TheFork'
      type: number
      options:
        min: 5
        max: 10
    - name: source
      label: Fonte (Google o TheFork)
      type: string
    - name: sourceUrl
      label: Link HTTPS recensione originale
      type: string
    - name: excerpt
      label: Testo parziale / estratto
      type: boolean
- name: menu
  label: Menu
  type: file
  path: data/menu.json
  format: json
  fields:
  - name: note
    label: Nota menu (lasciare vuota quando approvato)
    type: text
  - name: categories
    label: Categorie del menu
    type: object
    list: true
    fields:
    - name: title
      label: Nome categoria
      type: string
      required: true
    - name: dishes
      label: Piatti
      type: object
      list: true
      fields:
      - name: name
        label: Nome piatto
        type: string
        required: true
      - name: description
        label: Descrizione e ingredienti
        type: text
      - name: price
        label: Prezzo in euro
        type: number
        required: true
        options:
          min: 0
- name: about
  label: Chi siamo — Leonardo e Alessio
  type: file
  path: data/about.json
  format: json
  fields:
  - name: title
    label: Titolo
    type: string
  - name: titleEmphasis
    label: Titolo in corsivo
    type: string
  - name: lead
    label: Introduzione breve
    type: string
  - name: intro
    label: Presentazione
    type: text
  - name: story
    label: La nostra idea di osteria
    type: text
  - name: storyExtra
    label: Secondo paragrafo
    type: text
  - name: photo
    label: Foto di Leo e Alessio (carica la foto scelta)
    type: image
  - name: photoAlt
    label: Testo alternativo foto
    type: string
  - name: instagramPostUrl
    label: Link al post Instagram
    type: string
  - name: signature
    label: Firma
    type: string
